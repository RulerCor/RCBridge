<div class="tab-page" id="page-members">
  <div class="header">
    <h1><span class="en">People</span><span class="cn">成员与权限</span></h1>
    <div class="badge" id="membersBadge">加载中</div>
  </div>
  <div class="seg-bar">
    <button class="seg active" data-sub="groups" onclick="switchMembersTab('groups')">群聊</button>
    <button class="seg" data-sub="friends" onclick="switchMembersTab('friends')" hidden>私聊</button>
    <button class="seg" data-sub="admins" onclick="switchMembersTab('admins')" hidden>管理员</button>
    <div class="spacer"></div>
    <button id="btnSyncGroupNames" hidden onclick="syncGroupNames()">同步群名</button>
    <button id="btnImportGroupNames" hidden onclick="memberEl('groupNamesFile').click()" title="选择 WeRC 导出的通讯录 JSON">导入 JSON</button>
    <input id="groupNamesFile" type="file" accept=".json,application/json" hidden onchange="importGroupNames(this)">
    <button id="btnRefreshPeople" onclick="refreshPeople()">刷新名单</button>
  </div>
  <div class="members-sub active" id="sub-groups">
    <div class="card">
      <div class="toolbar"><input class="search-input" id="groupSearch" placeholder="搜索群名或 ID" aria-label="搜索群聊" oninput="renderGroups()"><div class="spacer"></div><span class="set-note" id="groupCount"></span></div>
      <p class="card-sub" id="groupNameHint" hidden>点「同步群名」从 WeRC 获取名称；旧版 WeRC 可导入 JSON。</p>
      <p class="card-sub" id="groupNotice" role="status"></p>
      <table class="member-table"><thead><tr><th>回复</th><th>群名</th><th>OneBot 群 ID</th></tr></thead><tbody id="groupsBody"><tr><td colspan="3">加载中…</td></tr></tbody></table>
    </div>
  </div>
  <div class="members-sub" id="sub-friends">
    <div class="card">
      <h3>私聊白名单</h3><p class="card-sub">开启后只回复选中的好友。</p>
      <div class="toolbar"><label><input type="checkbox" id="fw_enable" onchange="markDirty()"> 启用白名单</label></div>
      <input class="search-input" id="fwSearch" placeholder="搜索好友" aria-label="搜索好友" oninput="renderFriends()">
      <div class="card" id="fw_friends"></div>
    </div>
  </div>
  <div class="members-sub" id="sub-admins">
    <div class="card">
      <h3>管理员</h3><p class="card-sub">只授予可信好友。保存后重启 AstrBot 生效。</p>
      <input class="search-input" id="memberSearch" placeholder="搜索好友" aria-label="搜索管理员" oninput="renderAdmins()">
      <div class="card" id="peopleList"></div>
    </div>
  </div>
  <div class="save-bar" id="peopleSaveBar" hidden>
    <button class="primary" id="abSaveBtn" onclick="saveAll()" disabled>保存权限</button>
    <button id="abRestartBtn" onclick="restartAstrbot()">重启 AstrBot</button>
    <span class="sub" id="abStatus"></span>
  </div>
</div>
