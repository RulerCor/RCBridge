<div class="tab-page" id="page-settings">
  <div class="header"><h1><span class="en">Settings</span><span class="cn">连接设置</span></h1></div>
  <div class="card">
    <h3>WeRC</h3>
    <p class="card-sub">在 WeRC 的「Bot 接入」复制配置，粘贴到这里。</p>
    <textarea id="wercBundle" rows="2" autocomplete="off" spellcheck="false" aria-label="WeRC 接入配置"></textarea>
    <div class="toolbar"><button id="importWeRCBtn" onclick="importWeRC()" disabled>导入配置</button><button id="testWeRCBtn" onclick="testWeRC()" disabled>测试连接</button></div>
    <details class="tier"><summary>手动填写 WeRC 授权</summary><div id="wercFields" class="form-grid tier-body"></div></details>
  </div>
  <div class="card"><h3>OneBot v11</h3><div id="onebotFields" class="form-grid settings-row"></div></div>
  <details class="tier">
    <summary>其他接入与端口</summary>
    <div id="advancedFields" class="form-grid tier-body"></div>
  </details>
  <div class="save-bar"><button class="primary" id="saveConfigBtn" onclick="saveConfig()" disabled>保存</button><span class="sub" id="settingsHint">保存后重新打开 RCBridge。</span></div>
</div>
