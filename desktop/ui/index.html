<!doctype html><html lang="zh-CN" data-ef-variant="site"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RCBridge</title><link rel="icon" href="/icon.png"><link rel="stylesheet" href="/theme.css"><body>
<aside><div class="series">RC<span>/</span> BRIDGE</div><div class="brand"><img src="/icon.png" width="58" height="58" alt="举花的 Mon3tr"><div>RCBridge<small>微信桥接工作站</small></div></div><nav aria-label="工作区"><button class="nav-item active" data-tab="dashboard" onclick="switchTab('dashboard')"><i>01</i>运行总览</button><button class="nav-item" data-tab="settings" onclick="switchTab('settings')"><i>02</i>设置</button><button class="nav-item" data-tab="members" onclick="switchTab('members')"><i>03</i>成员与权限</button></nav><footer>DESKTOP EDITION<br><strong>RCBridge <span id="displayVersion"></span></strong></footer></aside>
<main><section class="tab-page active" id="page-dashboard"><div class="kicker">// OPERATIONS</div><header><div><h1>运行总览</h1><p>微信与 OneBot 连接状态。</p></div><span class="badge" id="statusText">读取中</span></header>
<div class="route" aria-label="消息链路"><div><small>01 / INBOUND</small><strong id="recvStatus">—</strong><span id="recvDetail">消息接收</span></div><b>→</b><div><small>02 / ONEBOT V11</small><strong>OneBot</strong><span id="obStatus">读取中</span></div><b>→</b><div><small>03 / OUTBOUND</small><strong id="sendMethod">—</strong><span>回复发送</span></div></div>
<div class="toolbar actions"><button class="primary" id="btnStart" onclick="action('start')">启动桥接</button><button id="btnStop" onclick="action('stop')">停止桥接</button></div>
<div class="sectiontitle"><div><div class="kicker">// EVENT LOG</div><h2>运行日志</h2></div><small>最近 200 行</small></div><pre id="log" class="log-box" aria-label="运行日志">等待连接…</pre>
<details class="diag"><summary>WeRC 发件箱回执</summary><p>查看最近 25 条发送任务。</p><button onclick="inspectOutbox()">读取回执</button><pre id="receipts">尚未查询</pre></details></section>
<!--SETTINGS--><!--MEMBERS--></main><div id="toast" role="status" class="toast"></div><script src="/common.js"></script><script src="/settings.js"></script><script src="/members.js"></script><script src="/dashboard.js"></script></body></html>
